name: Apply development payload

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - '.dev/APPLY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Rebuild and verify payload
        shell: bash
        run: |
          cat .dev/payload.part.* | tr -d '\r\n' | base64 --decode > /tmp/decka-v020.zip
          unzip -t /tmp/decka-v020.zip
      - name: Apply payload
        shell: bash
        run: |
          unzip -o /tmp/decka-v020.zip -d .
          rm -rf .dev
      - name: Commit sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: implement Decka Typer 0.2.0"
          git push
