name: Validate plugin

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    name: PHP and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Notification template regression tests
        run: php tests/notification-templates.php

      - name: Club ranking regression tests
        run: php tests/ranking-clubs.php

      - name: Round availability regression tests
        run: php tests/round-availability.php

      - name: Admin user dashboard regression tests
        run: php tests/admin-user-dashboard.php

      - name: Admin prediction dashboard regression tests
        run: php tests/admin-prediction-dashboard.php

      - name: Complete admin user list regression tests
        run: php tests/admin-users.php

      - name: Push lifecycle regression tests
        run: node --test tests/push-lifecycle.cjs

      - name: Frontend prediction progress regression tests
        run: node tests/frontend-progress-style.cjs

      - name: Version consistency
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          grep -F "Version: ${VERSION}" decka-typer.php
          grep -F "define('DT_VERSION', '${VERSION}')" decka-typer.php
